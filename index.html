<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天津智动电子-项目信息调查表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://npm.elemecdn.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

    <style>
        :root {
            --bg-primary: #0a0f1a; --bg-secondary: #111827; --bg-card: #1a2332; --bg-input: #0d1320;
            --border-color: #2a3a52; --border-focus: #3b82f6; --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --text-muted: #64748b; --accent-blue: #3b82f6; --accent-cyan: #06b6d4; --accent-emerald: #10b981;
            --accent-amber: #f59e0b; --accent-rose: #f43f5e; --auth-bg: #f0f2f5; --auth-card-bg: #ffffff;
            --auth-text-primary: #1a1a2e; --auth-text-secondary: #6b7280; --auth-border: #e5e7eb;
            --auth-input-bg: #f9fafb; --auth-shadow: 0 25px 60px rgba(0,0,0,0.12); --auth-accent: #4f6ef7;
            --auth-accent-hover: #3b54e0; --auth-link: #4f6ef7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', 'Inter', system-ui, -apple-system, sans-serif; min-height: 100vh; overflow-x: hidden; transition: background 0.4s ease; }

        .auth-wrapper { display: flex; min-height: 100vh; background: var(--auth-bg); align-items: center; justify-content: center; padding: 1.5rem; position: relative; overflow: hidden; }
        .auth-bg-decoration { position: fixed; pointer-events: none; z-index: 0; border-radius: 50%; opacity: 0.06; filter: blur(80px); }
        .auth-bg-decoration.d1 { width: 500px; height: 500px; background: #4f6ef7; top: -150px; right: -100px; }
        .auth-bg-decoration.d2 { width: 400px; height: 400px; background: #06b6d4; bottom: -120px; left: -80px; }
        .auth-bg-decoration.d3 { width: 300px; height: 300px; background: #10b981; top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.04; }
        .auth-container { position: relative; z-index: 1; width: 100%; max-width: 440px; animation: authFadeIn 0.6s ease-out; }
        @keyframes authFadeIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .auth-card { background: var(--auth-card-bg); border-radius: 20px; padding: 2.5rem 2rem; box-shadow: var(--auth-shadow); border: 1px solid var(--auth-border); }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo .logo-icon { width: 52px; height: 52px; background: linear-gradient(135deg, #4f6ef7, #3b54e0); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; box-shadow: 0 8px 24px rgba(79,110,247,0.25); }
        .auth-logo h2 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--auth-text-primary); }
        .auth-logo p { font-size: 0.875rem; color: var(--auth-text-secondary); margin-top: 0.25rem; }
        .auth-form { display: flex; flex-direction: column; gap: 1.25rem; }
        .auth-input-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .auth-input-group label { font-size: 0.85rem; font-weight: 600; color: var(--auth-text-primary); }
        .auth-input-wrapper { position: relative; display: flex; align-items: center; }
        .auth-input-wrapper .input-icon { position: absolute; left: 14px; color: #9ca3af; pointer-events: none; z-index: 2; width: 18px; height: 18px; }
        .auth-input-wrapper input { width: 100%; padding: 0.8rem 1rem 0.8rem 2.75rem; background: var(--auth-input-bg); border: 1.5px solid var(--auth-border); border-radius: 12px; font-size: 0.95rem; font-family: inherit; color: var(--auth-text-primary); transition: all 0.25s ease; outline: none; }
        .auth-input-wrapper input:focus { border-color: var(--auth-accent); box-shadow: 0 0 0 4px rgba(79,110,247,0.08); background: #fff; }
        .auth-input-wrapper input::placeholder { color: #c4c9d4; }
        .auth-input-wrapper .toggle-pwd { position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #9ca3af; padding: 6px; border-radius: 6px; z-index: 2; transition: color 0.2s; }
        .auth-input-wrapper .toggle-pwd:hover { color: #4f6ef7; }
        .auth-btn { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #4f6ef7, #3b54e0); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(79,110,247,0.3); margin-top: 0.25rem; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(79,110,247,0.4); background: linear-gradient(135deg, #5b7af8, #4460e8); }
        .auth-btn:active { transform: translateY(0); box-shadow: 0 4px 14px rgba(79,110,247,0.3); }
        .auth-links { display: flex; justify-content: center; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.25rem; font-size: 0.875rem; }
        .auth-links a, .auth-links button { color: var(--auth-link); text-decoration: none; font-weight: 500; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 0.875rem; transition: color 0.2s; padding: 0.25rem 0.5rem; border-radius: 6px; }
        .auth-links a:hover, .auth-links button:hover { color: #2c44c8; background: rgba(79,110,247,0.06); }
        .auth-links .divider { color: #d1d5db; user-select: none; }
        .auth-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem; text-align: center; display: none; animation: shake 0.4s ease; }
        .auth-error.show { display: block; }
        .auth-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.85rem; text-align: center; display: none; }
        .auth-success.show { display: block; }
        @keyframes shake { 0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);} }

        .app-wrapper { display: none; min-height: 100vh; background: var(--bg-primary); color: var(--text-primary); position: relative; z-index: 1; }
        .app-wrapper.active { display: block; }
        .bg-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background: radial-gradient(ellipse 80% 50% at 20% 0%, rgba(59,130,246,0.15) 0%, transparent 50%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(6,182,212,0.1) 0%, transparent 50%); }
        .grid-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px); background-size: 60px 60px; }

        .app-navbar { position: sticky; top: 0; z-index: 50; background: rgba(17,24,39,0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .app-navbar .nav-brand { display: flex; align-items: center; gap: 0.75rem; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--text-primary); }
        .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-emerald); box-shadow: 0 0 10px rgba(16,185,129,0.6); animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100%{box-shadow:0 0 10px rgba(16,185,129,0.6);}50%{box-shadow:0 0 20px rgba(16,185,129,0.9);} }
        .nav-actions { display: flex; align-items: center; gap: 0.75rem; }
        .user-info { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; padding: 0.4rem 0.75rem; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid transparent; transition: all 0.3s; }
        .nav-btn { padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--text-secondary); cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 500; transition: all 0.3s; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.35rem; }
        .nav-btn:hover { border-color: var(--accent-cyan); color: var(--text-primary); background: rgba(6,182,212,0.06); }
        .logout-btn:hover { border-color: var(--accent-rose); color: var(--accent-rose); background: rgba(244,63,94,0.06); }
        .history-btn { border-color: var(--accent-emerald); color: var(--accent-emerald); background: rgba(16,185,129,0.06); }
        .history-btn:hover { background: rgba(16,185,129,0.15); color: #10b981; }

        .main-container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin-bottom: 2.5rem; animation: fadeInDown 0.8s ease-out; }
        .header-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.2)); border: 1px solid rgba(59,130,246,0.3); border-radius: 9999px; font-size: 0.875rem; color: var(--accent-cyan); margin-bottom: 1.5rem; }
        .header h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.5rem; }
        .header p { color: var(--text-secondary); font-size: 1rem; }

        .form-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 1rem; margin-bottom: 1.5rem; overflow: hidden; animation: fadeInUp 0.6s ease-out backwards; }
        .card-header { display: flex; align-items: center; gap: 1rem; padding: 1.25rem 1.5rem; background: linear-gradient(135deg, rgba(59,130,246,0.1), transparent); border-bottom: 1px solid var(--border-color); cursor: pointer; transition: all 0.3s ease; user-select: none; }
        .card-header:hover { background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.05)); }
        .card-icon { width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center; border-radius: 0.75rem; flex-shrink: 0; }
        .card-title h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
        .card-title span { font-size: 0.85rem; color: var(--text-muted); }
        .toggle-icon { color: var(--text-muted); transition: transform 0.3s ease; }
        .form-card.collapsed .toggle-icon { transform: rotate(-180deg); }
        .form-card.collapsed .card-content { display: none; }
        .card-content { padding: 1.5rem; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); }
        .required { color: var(--accent-rose); font-size: 0.75rem; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 0.75rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 0.5rem; color: var(--text-primary); font-size: 0.95rem; font-family: inherit; transition: all 0.3s ease; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
        .form-select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml,..."); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 1rem; padding-right: 2.5rem; }
        .form-textarea { min-height: 100px; resize: vertical; }

        .action-bar { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; gap: 0.75rem; padding: 1rem 2rem; border-radius: 0.75rem; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.3s ease; border: none; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-blue), #2563eb); color: white; box-shadow: 0 4px 20px rgba(59,130,246,0.3); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,130,246,0.4); }
        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-secondary); border-color: var(--accent-cyan); }
        .btn-success { background: linear-gradient(135deg, var(--accent-emerald), #059669); color: white; box-shadow: 0 4px 20px rgba(16,185,129,0.3); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(16,185,129,0.4); }

        .progress-bar { position: fixed; top: 56px; left: 0; width: 100%; height: 3px; background: var(--bg-secondary); z-index: 49; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); width: 0%; transition: width 0.3s ease; }

        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; background: var(--bg-card); border: 1px solid var(--accent-emerald); border-radius: 0.75rem; color: var(--text-primary); display: flex; align-items: center; gap: 0.75rem; box-shadow: 0 10px 40px rgba(0,0,0,0.3); transform: translateX(150%); transition: transform 0.4s ease; z-index: 1000; }
        .toast.show { transform: translateX(0); }
        .toast-icon { color: var(--accent-emerald); }

        /* 物料行与预置选择 */
        .item-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; flex-wrap: wrap; }
        .item-row input { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.4rem 0.5rem; border-radius: 4px; font-size: 0.85rem; }
        .item-row button { background: rgba(244,63,94,0.15); border: none; color: #f43f5e; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .item-row button:hover { background: rgba(244,63,94,0.3); }
        .preset-select { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.4rem 0.5rem; border-radius: 4px; font-size: 0.85rem; max-width: 200px; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 640px) {
            .main-container { padding: 1rem; }
            .header h1 { font-size: 1.5rem; }
            .card-content { padding: 1rem; }
            .action-bar { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .app-navbar { padding: 0 0.75rem; height: 48px; }
            .history-panel { width: 100%; max-width: 100%; }
        }
    </style>
</head>

        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <div class="history-overlay" id="historyOverlay" onclick="closeHistoryPanel()"></div>
        <div class="history-panel" id="historyPanel"> ... </div>

        <div class="main-container">
            <header class="header"> ... </header>

            <form id="projectForm">
                <!-- 项目概况等六个卡片内容不变，此处省略以节省篇幅 -->
                ...

                <!-- 报价物料清单（调整后） -->
                <div class="form-card" id="card-quotation">
                    <div class="card-header" onclick="toggleCard('card-quotation')">
                        <div class="card-icon blue"><i data-lucide="clipboard-list" style="width:20px;height:20px;color:#fff;"></i></div>
                        <div class="card-title"><h3>报价物料清单</h3><span>按系统分类填写物料明细</span></div>

                    <div class="card-content">

                                        <option value="">-- 选择预置物料 --</option>
                                    </select>
                                </div>
                            </div>
                            <!-- BPCS 系统 -->
                            <div style="margin-left:1.5rem;">
                                <h5 style="color:#94a3b8; margin-bottom:0.3rem;">1.2 BPCS 系统</h5>
                                <div id="bpcs-items"></div>
                                <div style="display:flex; gap:10px; align-items:center; margin-top:5px;">

                                    <select class="preset-select" onchange="addPresetItem('bpcs', this.value); this.selectedIndex=0;">
                                        <option value="">-- 选择预置物料 --</option>
                                    </select>
                                </div>
                            </div>

                                    <option value="">-- 选择预置物料 --</option>
                                </select>
                            </div>
                        </div>

                        <!-- 上位及通讯部分 -->
                        <div style="margin-bottom:1.5rem;">
                            <h4 style="color:#f1f5f9; margin-bottom:0.5rem;">三、上位及通讯部分</h4>
                            <div id="upper-items"></div>
                            <div style="display:flex; gap:10px; align-items:center; margin-top:5px;">
                                <button type="button" class="btn-secondary" style="padding:0.4rem 1rem;" onclick="addQuotationRow('upper')">+ 添加空行</button>

                        <!-- 其他费用 -->
                        <div>
                            <h4 style="color:#f1f5f9; margin-bottom:0.5rem;">五、其他费用</h4>
                            <div id="other-items"></div>
                            <div style="display:flex; gap:10px; align-items:center; margin-top:5px;">
                                <button type="button" class="btn-secondary" style="padding:0.4rem 1rem;" onclick="addQuotationRow('other')">+ 添加空行</button>
                                <select class="preset-select" onchange="addPresetItem('other', this.value); this.selectedIndex=0;">
                                    <option value="">-- 选择预置物料 --</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <button type="button" class="btn btn-secondary" onclick="resetForm()"><i data-lucide="rotate-ccw" style="width:20px;height:20px;"></i><span>重置表单</span></button>
                    <button type="button" class="btn btn-primary" onclick="previewData()"><i data-lucide="eye" style="width:20px;height:20px;"></i><span>预览数据</span></button>
                    <button type="button" class="btn btn-success" onclick="exportToExcel()"><i data-lucide="file-spreadsheet" style="width:20px;height:20px;"></i><span>导出调查表 (CSV)</span></button>

    <script>
        // ========== 预置物料数据库 ==========
        const PRESET_ITEMS = {
            sis: [ // SIS 系统常用物料

        // 初始化预置下拉选项
        function initPresetSelects() {
            for (let section in PRESET_ITEMS) {
                const container = document.getElementById(quotationSections[section]).parentElement;
                const select = container.querySelector('.preset-select');
                if (!select) continue;
                select.innerHTML = '<option value="">-- 选择预置物料 --</option>';
                PRESET_ITEMS[section].forEach((item, index) => {
                    const opt = document.createElement('option');
                    opt.value = index;
                    opt.textContent = `${item.name} ${item.spec} (${item.brand})`;
                    select.appendChild(opt);
                });
            }
        }

        // 预置物料添加函数
        function addPresetItem(section, indexStr) {
            if (indexStr === '') return;
            const index = parseInt(indexStr);
            const preset = PRESET_ITEMS[section][index];
            if (!preset) return;
            const container = document.getElementById(quotationSections[section]);
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" class="q-name" value="${escapeHtml(preset.name)}" style="width:150px;">
                <input type="text" class="q-spec" value="${escapeHtml(preset.spec)}" style="width:120px;">
                <input type="text" class="q-unit" value="${preset.unit}" style="width:60px;">
                <input type="number" class="q-qty" value="1" style="width:70px;">
                <input type="number" class="q-price" value="0" style="width:90px;">
                <input type="text" class="q-brand" value="${preset.brand}" style="width:90px;">
                <input type="text" class="q-remark" value="${escapeHtml(preset.remark)}" style="width:150px;">
                <button type="button" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(row);
        }

        // CSV 导出调查表功能（恢复）
        function getFieldLabels() {
            const labels = {};
            const elements = document.querySelectorAll('#projectForm [name]');
            elements.forEach(el => {
                const name = el.getAttribute('name');
                if (!name) return;
                const formGroup = el.closest('.form-group');
                if (formGroup) {
                    const labelEl = formGroup.querySelector('.form-label');
                    if (labelEl) {
                        let text = labelEl.textContent || '';
                        text = text.replace(/[*\s]+$/, '').trim();
                        labels[name] = text;
                    }
                }
            });
            return labels;
        }
        function escapeCsv(cell) {
            if (cell === null || cell === undefined) return '';
            const str = String(cell);
            if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }
        function exportToExcel() {
            const data = collectFormData();
            const labels = getFieldLabels();
            const headers = [];
            const values = [];
            for (const [name, label] of Object.entries(labels)) {
                headers.push(label);
                values.push(data[name] || '');
            }
            let csvContent = '\uFEFF';
            csvContent += headers.map(escapeCsv).join(',') + '\n';
            csvContent += values.map(escapeCsv).join(',') + '\n';
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `项目信息调查表_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            addHistoryRecord('项目调查表导出', data);
            updateHistoryPanel();
            showToast('调查表已导出为 CSV 文件！');
        }
